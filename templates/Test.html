{% extends 'layout.html' %}

{% block body %} 
<style>
#play-area {
    width: 600px;
    height: 400px;
    border: 2px solid rgb(0, 255, 0);
    margin: auto;
    position: relative;
    background: rgb(255, 0, 255);
}

.circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
}
</style>

<body>

<div class="text-center" style="margin-top: 5px;">
    <button class="btn btn-info" onclick="resetGame()">Restart Game</button>
</div>
<div class="modal" tabindex="-1" id="difficultyModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Choose Time</h5>
      </div>
      <div class="modal-body">
        <a href="/test?mode={{ mode }}&timer=30">30 Seconds</a><br>
        <a href="/test?mode={{ mode }}&timer=60">60 Seconds</a><br>
        <a href="/test?mode={{ mode }}&timer=90">90 Seconds</a><br>
      </div>
    </div>
  </div>
</div>
<div id="play-area"></div>

<h2>Score: <span id="score">0</span></h2>
let score = 0;
let gameActive = false;
<script>
function startGame(duration) {
    score = 0;
    gameActive = true;
    const endTime = Date.now() + duration * 1000;

    function spawnCircle() {
        if (!gameActive || Date.now() > endTime) {
            endGame(duration);
            return;
        }

        const circle = document.createElement("div");
        circle.classList.add("circle");
        circle.style.background = "green";

        const area = document.getElementById("game-area");
        const x = Math.random() * (area.clientWidth - 40);
        const y = Math.random() * (area.clientHeight - 40);

        circle.style.left = x + "px";
        circle.style.top = y + "px";

        let turnedRedAt = null;

        setTimeout(() => {
            circle.style.background = "red";
            turnedRedAt = Date.now();
        }, Math.random() * 2000 + 1000);

        circle.onclick = () => {
            if (!turnedRedAt) {
                score -= 50;
            } else {
                const reaction = Date.now() - turnedRedAt;
                score += Math.max(0, 1000 - reaction);
            }
            circle.remove();
        };

        area.appendChild(circle);

        setTimeout(spawnCircle, 800);
    }

    spawnCircle();
}

function endGame(mode) {
    gameActive = false;
    fetch("/submit_score", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mode, score})
    });
}
</script>


</body>

{% endblock %}
