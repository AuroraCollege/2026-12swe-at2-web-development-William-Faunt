{% extends 'Layout.html' %}
{% block body %}
<head>
    <title>Leaderboard</title>
    <style>
        body { font-family: Arial; }
        table { border-collapse: collapse; width: 400px; margin-top: 20px; }
        th, td { border: 1px solid rgb(0, 255, 0)1 296.81,; padding: 8px; text-align: left; }
        th { background: darkslategray; }
    </style>
</head>
<body>

<h1>Leaderboard</h1>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <label for="modeSelect" class="form-label fw-bold">Select Mode</label>
            <select id="modeSelect" class="form-select">
                <option value="30">30 Seconds</option>
                <option value="60">60 Seconds</option>
                <option value="90">90 Seconds</option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" onclick="loadLeaderboard()">Load</button>
        </div>
    </div>
</div>

<button class="btn btn-secondary" onclick="loadLeaderboard()">Load</button>

<div class="container mt-4">
    <table class="table table-striped table-bordered text-center">
        <thead class="table-dark">
            <tr>
                <th>Rank</th>
                <th>Username</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="leaderboardTable"></tbody>
    </table>
</div>
<button class="btn btn-warning" href="Test.html">Retry test?</button>
<script>
function loadLeaderboard() {
    const mode = document.getElementById("modeSelect").value;

    fetch(`/leaderboard/${mode}`)
        .then(r => r.json())
        .then(data => {
            const tbody = document.querySelector("#leaderboardTable tbody");
            tbody.innerHTML = "";

            data.forEach((row, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${row.username}</td>
                    <td>${row.score}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");

    if (mode) {
        document.getElementById("modeSelect").value = mode;
        loadLeaderboard();
    }
};
}
</script>

</body>
{% endblock %}
